# Nightly drift detection (PLAN Task 16): plan against real infrastructure and
# open/update one `drift` issue when they differ; close it when clean again.
name: drift

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: terraform-prod
  cancel-in-progress: false

jobs:
  drift:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    env:
      HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TAILSCALE_OAUTH_CLIENT_ID: ${{ secrets.TS_TF_OAUTH_CLIENT_ID }}
      TAILSCALE_OAUTH_CLIENT_SECRET: ${{ secrets.TS_TF_OAUTH_SECRET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_STATE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_STATE_SECRET_ACCESS_KEY }}
      TF_VAR_cloudflare_zone_id: ${{ vars.CF_ZONE_ID }}
      TF_VAR_cloudflare_account_id: ${{ vars.CF_ACCOUNT_ID }}
      TF_VAR_admin_password_hash: ${{ secrets.ADMIN_PASSWORD_HASH }}
      TF_VAR_hc_ping_key: ${{ secrets.HC_PING_KEY }}
      CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
      TF_IN_AUTOMATION: "1"
      TF_INPUT: "0"
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false

      - name: Write backend config
        run: printf 'endpoints = { s3 = "https://%s.r2.cloudflarestorage.com" }\n' "$CF_ACCOUNT_ID" > backend.hcl

      - name: Init
        run: terraform init -backend-config=backend.hcl -no-color

      - name: Plan
        id: plan
        run: |
          set +e
          terraform plan -detailed-exitcode -lock-timeout=5m -no-color -out=tfplan > plan.log 2>&1
          code=$?
          set -e
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 1 ]; then
            tail -n 50 plan.log
            exit 1
          fi
          if [ "$code" -eq 2 ]; then
            terraform show -no-color tfplan | grep -E '^\s+# |^Plan:' > summary.txt || true
          fi

      - name: Leak check
        if: steps.plan.outputs.exitcode == '2'
        run: ../scripts/leak_check.sh summary.txt

      - name: Upload full plan (private artifact, 7 days)
        if: steps.plan.outputs.exitcode == '2'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: drift-plan
          path: terraform/plan.log
          retention-days: 7

      - name: Open or update drift issue
        if: steps.plan.outputs.exitcode == '2'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "Nightly \`terraform plan\` found differences between code and real infrastructure."
            echo
            echo "Run: $RUN_URL (full plan in the \`drift-plan\` artifact)"
            echo
            echo "<details><summary>Plan summary</summary>"
            echo
            echo '```'
            cat summary.txt
            echo '```'
            echo "</details>"
          } > body.md
          num="$(gh issue list --label drift --state open --json number --jq '.[0].number // empty')"
          if [ -n "$num" ]; then
            gh issue edit "$num" --body-file body.md
            gh issue comment "$num" --body "Still drifting as of $RUN_URL"
          else
            gh issue create --title "Terraform drift detected" --label drift --body-file body.md
          fi

      - name: Close resolved drift issues
        if: steps.plan.outputs.exitcode == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          for num in $(gh issue list --label drift --state open --json number --jq '.[].number'); do
            gh issue close "$num" --comment "No drift as of $RUN_URL"
          done
