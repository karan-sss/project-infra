name: terraform

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - "terraform/**"
      - "scripts/**"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - "scripts/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: terraform-prod
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "1"
  TF_INPUT: "0"

jobs:
  plan:
    name: plan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: terraform
    env:
      HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TAILSCALE_OAUTH_CLIENT_ID: ${{ secrets.TS_TF_OAUTH_CLIENT_ID }}
      TAILSCALE_OAUTH_CLIENT_SECRET: ${{ secrets.TS_TF_OAUTH_SECRET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_STATE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_STATE_SECRET_ACCESS_KEY }}
      TF_VAR_cloudflare_zone_id: ${{ vars.CF_ZONE_ID }}
      TF_VAR_cloudflare_account_id: ${{ vars.CF_ACCOUNT_ID }}
      TF_VAR_admin_password_hash: ${{ secrets.ADMIN_PASSWORD_HASH }}
      TF_VAR_hc_ping_key: ${{ secrets.HC_PING_KEY }}
      ALLOW_REPLACE: ${{ contains(github.event.pull_request.labels.*.name, 'allow-replace') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false

      - name: Write backend config
        env:
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
        run: printf 'endpoints = { s3 = "https://%s.r2.cloudflarestorage.com" }\n' "$CF_ACCOUNT_ID" > backend.hcl

      - name: fmt
        run: terraform fmt -check -recursive

      - name: init
        run: terraform init -backend-config=backend.hcl

      - name: validate
        run: terraform validate -no-color

      - name: plan
        run: |
          terraform plan -out=tfplan -no-color -lock-timeout=5m > plan.txt
          terraform show -json tfplan > plan.json
          { grep -E '^\s+# |^Plan:|^No changes|^Changes to Outputs' plan.txt || true; } > summary.txt

      - name: Leak check
        run: ../scripts/leak_check.sh plan.txt summary.txt

      - name: Plan guard
        id: guard
        continue-on-error: true
        run: ../scripts/plan_guard.py plan.json > guard.md

      - name: Upload plan text
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: terraform-plan
          path: terraform/plan.txt
          retention-days: 7

      - name: Sticky PR comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GUARD_OUTCOME: ${{ steps.guard.outcome }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- terraform-plan -->';
            const guard = fs.readFileSync('terraform/guard.md', 'utf8');
            const summary = fs.readFileSync('terraform/summary.txt', 'utf8').trim() || '(empty)';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              marker,
              `### Terraform plan ${process.env.GUARD_OUTCOME === 'success' ? '✅' : '❌'}`,
              guard,
              '<details><summary>Resource changes</summary>',
              '',
              '```',
              summary,
              '```',
              '</details>',
              '',
              `Full plan: [workflow run](${run}) (artifact \`terraform-plan\`, 7 days).`,
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Fail if plan guard failed
        if: steps.guard.outcome != 'success'
        run: |
          echo "::error::Plan guard failed (budget or protected-resource replacement). See the PR comment."
          exit 1

  apply:
    name: apply
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
      pull-requests: read
    defaults:
      run:
        working-directory: terraform
    env:
      HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TAILSCALE_OAUTH_CLIENT_ID: ${{ secrets.TS_TF_OAUTH_CLIENT_ID }}
      TAILSCALE_OAUTH_CLIENT_SECRET: ${{ secrets.TS_TF_OAUTH_SECRET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_STATE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_STATE_SECRET_ACCESS_KEY }}
      TF_VAR_cloudflare_zone_id: ${{ vars.CF_ZONE_ID }}
      TF_VAR_cloudflare_account_id: ${{ vars.CF_ACCOUNT_ID }}
      TF_VAR_admin_password_hash: ${{ secrets.ADMIN_PASSWORD_HASH }}
      TF_VAR_hc_ping_key: ${{ secrets.HC_PING_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false

      - name: Write backend config
        env:
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
        run: printf 'endpoints = { s3 = "https://%s.r2.cloudflarestorage.com" }\n' "$CF_ACCOUNT_ID" > backend.hcl

      - name: init
        run: terraform init -backend-config=backend.hcl

      - name: plan
        run: |
          terraform plan -out=tfplan -no-color -lock-timeout=5m > plan.txt
          terraform show -json tfplan > plan.json

      - name: Leak check
        run: ../scripts/leak_check.sh plan.txt

      - name: allow-replace label of the merged PR
        id: label
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          allow=$(gh api "repos/$REPO/commits/$SHA/pulls" --jq '[.[0].labels[]?.name] | index("allow-replace") != null' || echo false)
          echo "allow=${allow:-false}" >> "$GITHUB_OUTPUT"

      - name: Plan guard
        env:
          ALLOW_REPLACE: ${{ steps.label.outputs.allow }}
        run: ../scripts/plan_guard.py plan.json

      - name: apply
        run: terraform apply -no-color -lock-timeout=5m tfplan

      - name: Outputs
        run: terraform output -no-color >> "$GITHUB_STEP_SUMMARY"
