name: lint

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  terraform:
    name: terraform
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
      - name: fmt
        run: terraform -chdir=terraform fmt -check -recursive
      - name: validate
        run: |
          terraform -chdir=terraform init -backend=false
          terraform -chdir=terraform validate -no-color
      - name: tflint
        working-directory: terraform
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tflint --init --config "$GITHUB_WORKSPACE/.tflint.hcl"
          tflint --config "$GITHUB_WORKSPACE/.tflint.hcl" --format compact

  trivy-config:
    name: trivy (IaC misconfig)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: sarif
          output: trivy-config.sarif
          severity: CRITICAL,HIGH,MEDIUM
      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        if: always() && github.event.pull_request.head.repo.fork != true
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config

  workflows:
    name: actionlint + zizmor
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        env:
          VERSION: 1.7.12
        run: |
          base="https://github.com/rhysd/actionlint/releases/download/v${VERSION}"
          curl -fsSLO "$base/actionlint_${VERSION}_linux_amd64.tar.gz"
          curl -fsSLO "$base/actionlint_${VERSION}_checksums.txt"
          grep "linux_amd64.tar.gz" "actionlint_${VERSION}_checksums.txt" | sha256sum -c -
          tar xzf "actionlint_${VERSION}_linux_amd64.tar.gz" actionlint
          ./actionlint -color
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false
          persona: regular

  yaml-shell:
    name: yamllint + shellcheck
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: yamllint
        run: |
          pipx install yamllint==1.37.1
          yamllint -c .yamllint .
      - name: shellcheck
        run: |
          mapfile -t files < <(git ls-files '*.sh')
          if [ "${#files[@]}" -gt 0 ]; then shellcheck "${files[@]}"; fi

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: "false"
