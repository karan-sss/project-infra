# Shared Redis cache (PLAN Task 11). No secrets here: users live in users.acl,
# rendered on the server by render-acl.sh (never committed).
bind * -::*
protected-mode yes
port 6379

aclfile /usr/local/etc/redis/users.acl

# cache only: no persistence
save ""
appendonly no

maxmemory 64mb
maxmemory-policy allkeys-lru

loglevel notice
